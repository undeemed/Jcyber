[project]
name = "jcyber"
version = "0.0.0"
description = "MCP toolkit for agent-driven pentesting. The agent harness is the brain; Jcyber provides scope-gated tools, evidence graph, and finding lifecycle."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jcyber contributors" }]
keywords = [
    "offensive-security",
    "pentest",
    "bug-bounty",
    "red-team",
    "security",
    "mcp",
    "agent",
    "memgraph",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",          # MCP server (FastMCP) — the primary interface
    "neo4j>=5",           # Memgraph session brain (Bolt); Memgraph is Bolt-compatible
    "httpx>=0.27",        # HexStrike REST, Caido API, TencentDB HTTP seam
    "python-dotenv>=1.0", # Load .env (secrets live there, not in process env)
]

[project.optional-dependencies]
jev = ["typesafe-sdk"]  # Jev classifiers (triage, severity, duplicate, tool hint)

[project.urls]
Repository = "https://github.com/undeemed/Jcyber"

[project.scripts]
jcyber = "jcyber.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.390",
    "pytest>=8",
    "typesafe-sdk",    # needed for pyright to type-check jcyber/clients/jev.py
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["jcyber", "tests"]
# Strict everywhere. The "unknown" rules fire only on partially-typed third-party
# SDKs; they are relaxed via per-file pragmas in the adapter files that wrap
# them (jcyber/clients/*), keeping the pure decision core fully strict.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
